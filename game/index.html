<script>
  /* しおりで選んだ「画面の明るさ」と「文字の大きさ」を、このページにも使う（同じ端末の保存を読むだけ） */
  try {
    const t = JSON.parse(localStorage.getItem('theme'));
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    if (JSON.parse(localStorage.getItem('fs')) === 'l') document.documentElement.dataset.fs = 'l';
  } catch (e) { /* 読めなくても続ける */ }
</script>
